# Runs on push (any branch), not pull_request: PR checks attach to the head
# commit either way, and pushes made by the sync-prs bot start no runs
# (instead of parking in "approval required"; sync-prs tests those itself).
name: Tests

on:
  push:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow pytest "jsonschema==4.17.3"
      - run: python -m pytest tests/ -q
