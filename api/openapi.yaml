openapi: 3.1.0
info:
  title: Resource Library API
  version: 1.0.0
  description: |
    Read-only API over the curated resource catalog. The static artifacts
    under api/v1/ are the deployment surface (any static host); scripts/
    api_server.py is a stdlib-only local adapter that serves the same
    payloads plus live lexical search for contract verification. No auth,
    no write endpoints, no vector search.

    On Cloudflare Pages, functions/api/v1/ adds the dynamic routes
    (/resources, /resources/{id}, /search) as a JS port of the adapter,
    reading this deployment's own static assets. All routes accept
    GET, HEAD, and OPTIONS (CORS: Access-Control-Allow-Origin: *); any
    other method returns 405 with error code "method_not_allowed".
    Successful responses carry ETag (If-None-Match -> 304) and
    Cache-Control: 60s for /search, 300s for /resources, 3600s for
    /resources/{id}. Error codes: bad_fields, bad_limit, bad_cursor,
    bad_filter, bad_sort, not_found, method_not_allowed,
    catalog_unavailable, internal.
  contact:
    url: https://github.com/WyrdWerk/resource-library
servers:
  - url: /api/v1
    description: Static artifacts (relative to site root)
paths:
  /index.json:
    get:
      summary: API manifest
      responses:
        '200':
          description: Manifest with version, counts, and content hashes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manifest'
  /taxonomy.json:
    get:
      summary: Taxonomy registries and curated synonyms
      responses:
        '200':
          description: The five taxonomy registries plus the synonym map
          content:
            application/json:
              schema:
                type: object
  /resources.json:
    get:
      summary: Full canonical record array (static asset)
      description: |
        The raw, ordered array of all records. On Cloudflare Pages this is
        served as a static file; query parameters are ignored. The
        paginated view with fields/limit/cursor lives at /resources.
      responses:
        '200':
          description: All records in canonical order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Resource'
  /resources:
    get:
      summary: Canonical records in stable order (paginated)
      description: |
        Same payload shape as the local adapter's /resources.json route.
        On Cloudflare Pages this is a Pages Function; the static
        resources.json asset is unaffected.
      parameters:
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated records in canonical order
          content:
            application/json:
              schema:
                type: object
                required: [records, total]
                properties:
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/Resource'
                  next_cursor:
                    type: [string, 'null']
                  total:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
  /resources/{id}:
    get:
      summary: One canonical record by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: openrouter
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: The canonical record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
  /search:
    get:
      summary: Deterministic lexical search
      description: |
        Exact id or normalized-URL queries rank first. Otherwise a fixed
        weighted lexical score over title, brief, taxonomy labels, and
        curated aliases (see scripts/search.py). No embeddings.
      parameters:
        - name: q
          in: query
          schema:
            type: string
          example: open source react components
        - name: resource_type
          in: query
          schema:
            $ref: '#/components/schemas/ResourceType'
        - name: type
          in: query
          description: Alias of resource_type
          schema:
            $ref: '#/components/schemas/ResourceType'
        - name: topic
          in: query
          schema:
            type: string
        - name: use_case
          in: query
          schema:
            type: string
        - name: interface
          in: query
          schema:
            type: string
            enum: [web, api, cli, desktop, extension, mcp]
        - name: technology
          in: query
          schema:
            type: string
        - name: channel
          in: query
          schema:
            type: string
            enum: [share-tech, providers]
        - name: open_source
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, newest, oldest]
            default: relevance
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Ranked results with a stable pagination cursor
          content:
            application/json:
              schema:
                type: object
                required: [query, results]
                properties:
                  query:
                    type: string
                  filters:
                    type: object
                  sort:
                    type: string
                  limit:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Resource'
                  next_cursor:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  parameters:
    Fields:
      name: fields
      in: query
      description: Sparse field selection (comma-separated top-level fields)
      schema:
        type: string
      example: id,title,canonical_url
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous next_cursor
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Unknown route or id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ResourceType:
      type: string
      enum: [article-guide, dataset, directory-gallery, documentation, library-framework, other, provider, repository, service-platform, template-starter, tool]
    Resource:
      type: object
      required: [schema_version, id, title, canonical_url, brief, resource_type, topics, use_cases, source, shared_on]
      properties:
        schema_version:
          type: string
          const: '1.0'
        id:
          type: string
          example: openrouter
        title:
          type: string
        canonical_url:
          type: string
          format: uri
        brief:
          type: string
        caveat:
          type: [string, 'null']
        resource_type:
          $ref: '#/components/schemas/ResourceType'
        topics:
          type: array
          items:
            type: string
        use_cases:
          type: array
          items:
            type: string
        interfaces:
          type: array
          items:
            type: string
        technologies:
          type: array
          items:
            type: string
        license:
          type: [string, 'null']
        open_source:
          type: [boolean, 'null']
        display_period:
          type: string
        legacy_categories:
          type: array
          items:
            type: string
        source:
          type: object
          required: [channel, sharer]
          properties:
            channel:
              type: string
              enum: [share-tech, providers]
            sharer:
              type: string
        shared_on:
          type: string
          format: date
        verification:
          type: object
          properties:
            status:
              type: string
              enum: [reachable, unreachable, unchecked]
            checked_at:
              type: [string, 'null']
              format: date-time
            final_url:
              type: [string, 'null']
    Manifest:
      type: object
      required: [api_version, record_count, resources_sha256]
      properties:
        api_version:
          type: string
        generated_at:
          type: string
          format: date-time
        record_count:
          type: integer
        channels:
          type: array
          items:
            type: string
        resources_sha256:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: not_found
            message:
              type: string
